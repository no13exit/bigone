
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Registration 2.2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/form.css">

    <script src="js/user.js" defer></script>
    <script src="js/userManager.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
<main class="container my-5">
    <h1>User Registration</h1>

    <form id="registrationForm" novalidate>
        <input id="name" type="text" placeholder="Name">
        <input id="email" type="text" placeholder="Email">
        <input id="age" type="number" step="any" placeholder="Age">

        <div class="d-flex gap-2">
            <button id="submitButton" type="submit">
                Register
            </button>

            <button id="cancelButton" type="button" class="d-none">
                Cancel
            </button>
        </div>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

  
<h2>Registered Users</h2>

<div id="statistics" class="row g-2 my-3">
    <div class="col-6">
        <div class="stat-card">
            <div class="stat-value" id="totalStat">0</div>
            <div>Total Users</div>
        </div>
    </div>

    <div class="col-6">
        <div class="stat-card">
            <div class="stat-value" id="adultsStat">0</div>
            <div>Adults (18+)</div>
        </div>
    </div>

    <div class="col-6">
        <div class="stat-card">
            <div class="stat-value" id="minorsStat">0</div>
            <div>Minors</div>
        </div>
    </div>

    <div class="col-6">
        <div class="stat-card">
            <div class="stat-value" id="averageStat">0</div>
            <div>Average Age</div>
        </div>
    </div>
</div>


    <div class="d-flex gap-2 mb-3">
        <button id="showAll" type="button">Show All</button>
        <button id="showAdults" type="button">Show Adults</button>
    </div>

    <ul id="userList"></ul>
</main>
</body>
</html>
